name: Publish DragonAltar API

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish-api:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify release tag matches the Maven version
        shell: bash
        run: |
          version=$(mvn help:evaluate -pl dragonaltar-api \
            -Dexpression=project.version -q -DforceStdout)
          if [ "${{ github.event.release.tag_name }}" != "v${version}" ]; then
            echo "Release tag must be v${version}" >&2
            exit 1
          fi
      - name: Verify reactor
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Publish API artifact only
        run: mvn --batch-mode --no-transfer-progress -pl dragonaltar-api -DskipTests deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
