name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  verify:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile against newest supported Paper API
        run: mvn --batch-mode --no-transfer-progress -Dpaper.api.version=1.21.11-R0.1-SNAPSHOT -DskipTests clean compile
      - name: Verify release build
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify release JAR
        id: artifact
        shell: bash
        run: |
          mapfile -t jars < <(find dragonaltar/target -maxdepth 1 -type f -name 'DragonAltar-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          jar_file="${jars[0]}"
          for required in plugin.yml config.yml abilities.yml altar.yml animations.yml messages.yml ritual.yml \
            META-INF/LICENSE.md com/dragonaltar/api/DragonAltarApi.class; do
            if ! jar tf "$jar_file" | grep -Fxq "$required"; then
              echo "Release JAR is missing $required" >&2
              exit 1
            fi
          done
          unexpected_classes=$(jar tf "$jar_file" | awk '/\.class$/ && $0 !~ /^com\/dragonaltar\//')
          if [ -n "$unexpected_classes" ]; then
            echo "Unexpected shaded classes in release JAR:" >&2
            echo "$unexpected_classes" >&2
            exit 1
          fi
          echo "path=$jar_file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_file" .jar)" >> "$GITHUB_OUTPUT"
      - name: Verify standalone API JAR
        shell: bash
        run: |
          api_jar="dragonaltar-api/target/dragonaltar-api-$(mvn help:evaluate \
            -pl dragonaltar-api -Dexpression=project.version -q -DforceStdout).jar"
          test -f "$api_jar"
          unexpected=$(jar tf "$api_jar" | awk '/\.class$/ && $0 !~ /^com\/dragonaltar\/api\//')
          if [ -n "$unexpected" ]; then
            echo "Unexpected classes in API JAR:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          for forbidden in com/dragonaltar/soul/DragonSoul \
            com/dragonaltar/eligibility/EligibilityService \
            com/dragonaltar/ability/AbilityResult \
            com/dragonaltar/dragonevent/DragonEventState; do
            if grep -aRq "$forbidden" dragonaltar-api/target/classes; then
              echo "API bytecode references internal type $forbidden" >&2
              exit 1
            fi
          done
      - name: Upload verified JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  compile-26x:
    name: Compile Paper ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1.2'
            paper-api: '26.1.2.build.74-stable'
          - minecraft: '26.2'
            paper-api: '26.2.build.111-stable'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile against Paper ${{ matrix.minecraft }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dpaper.api.version=${{ matrix.paper-api }} -DskipTests clean compile

  smoke-26x:
    name: Start Paper ${{ matrix.minecraft }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1.2', '26.2']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: artifact
      - name: Download latest stable Paper server
        shell: bash
        run: |
          set -euo pipefail
          user_agent='DragonAltar-CI/1.0 (https://github.com/Silverfox0338/dragonaltar)'
          builds=$(curl --fail --silent --show-error \
            --header "User-Agent: ${user_agent}" \
            "https://fill.papermc.io/v3/projects/paper/versions/${{ matrix.minecraft }}/builds")
          server_url=$(jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty' \
            <<<"${builds}")
          if [ -z "${server_url}" ]; then
            echo "No stable Paper build found for ${{ matrix.minecraft }}" >&2
            exit 1
          fi
          mkdir -p test-server/plugins
          curl --fail --location --show-error --silent \
            --header "User-Agent: ${user_agent}" --output test-server/server.jar "${server_url}"
          cp artifact/DragonAltar-*.jar test-server/plugins/
          printf 'eula=true\n' > test-server/eula.txt
          printf 'online-mode=false\n' > test-server/server.properties
      - name: Verify DragonAltar starts
        shell: bash
        working-directory: test-server
        run: |
          set -euo pipefail
          java -Xms1G -Xmx2G -jar server.jar --nogui > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            set +e
            if kill -0 "${server_pid}" 2>/dev/null; then
              kill -TERM "${server_pid}" 2>/dev/null
              for _ in $(seq 1 30); do
                kill -0 "${server_pid}" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "${server_pid}" 2>/dev/null || true
            fi
            wait "${server_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 150); do
            if grep -Fq 'Done (' server.log; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "${ready}" != true ]; then
            cat server.log
            exit 1
          fi
          grep -Eq '\[DragonAltar\] Enabling DragonAltar v[0-9]' server.log
          if grep -Eq 'Error occurred while enabling DragonAltar|Could not load.*DragonAltar|NoClassDefFoundError|NoSuch(Method|Field)Error' server.log; then
            cat server.log
            exit 1
          fi
