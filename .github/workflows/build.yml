name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify release build
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Locate verified JAR
        id: artifact
        shell: bash
        run: |
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'DragonAltar-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${jars[0]}" .jar)" >> "$GITHUB_OUTPUT"
      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
