name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify release build
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify release JAR
        id: artifact
        shell: bash
        run: |
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'DragonAltar-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          jar_file="${jars[0]}"
          for required in plugin.yml config.yml abilities.yml altar.yml animations.yml messages.yml ritual.yml \
            META-INF/LICENSE.md com/dragonaltar/api/DragonAltarApi.class; do
            if ! jar tf "$jar_file" | grep -Fxq "$required"; then
              echo "Release JAR is missing $required" >&2
              exit 1
            fi
          done
          unexpected_classes=$(jar tf "$jar_file" | awk '/\.class$/ && $0 !~ /^com\/dragonaltar\//')
          if [ -n "$unexpected_classes" ]; then
            echo "Unexpected shaded classes in release JAR:" >&2
            echo "$unexpected_classes" >&2
            exit 1
          fi
          echo "path=$jar_file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$jar_file" .jar)" >> "$GITHUB_OUTPUT"
      - name: Upload verified JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
