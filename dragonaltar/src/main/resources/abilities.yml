# Dragon Energy is regenerated by one central scheduler.
config-version: 7
energy:
  maximum: 100
  regeneration: 2
  regeneration-interval-ticks: 20
  delay-after-cast-ticks: 60
presentation:
  maximum-particles-per-emission: 128
  maximum-ring-points: 48
  maximum-flame-arc-particles: 16
  view-distance-blocks: 48
focus:
  # The Focus is identified by PDC; its name is cosmetic MiniMessage.
  material: ECHO_SHARD
  name: '<light_purple>Dragon Focus'
  blocked-command-prefixes:
    - 'ah sell'
    - 'auction sell'
    - 'auctionhouse sell'
    - 'market sell'
    - 'sell'
  blocked-inventory-command-prefixes:
    - 'sellall'
passives:
  # additional-hearts is measured in hearts, not health points.
  additional-hearts: 2
  slow-falling: true
  neutral-endermen: true
  particles: true
